name: Assemble globals.css
on:
  push:
    paths:
      - 'globals-parts/**'
      - '.github/workflows/assemble-globals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write globals.css
        run: |
          python3 << 'PY'
          import base64, pathlib
          data = ''.join(p.read_text() for p in sorted(pathlib.Path('globals-parts').glob('part-*.b64')))
          pathlib.Path('app').mkdir(exist_ok=True)
          out = pathlib.Path('app/globals.css')
          out.write_bytes(base64.b64decode(data))
          print('wrote', out.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf globals-parts
          rm -f .github/workflows/assemble-globals.yml
          git add -A
          git status
          git commit -m "Add app/globals.css via Actions" || exit 0
          git pull --rebase origin main || true
          git push
